spring.application.name=healthcare-auth

server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/healthcare_auth_DB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# secret key
jwt.secret=${JWT_SECRET}
# 15 minutes for access token
jwt.access-token-expiration=900000
# 7 days for refresh token
jwt.refresh-token-expiration=604800000
jwt.issuer= healthCare-System

notification-service.url=http://localhost:8083/api/v1/notification
app.verification.base-url=http://localhost:8081

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics

auth.account.max-failed-attempts=5
auth.account.lock-duration=30

# KAFKA Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Don't put the Java class name
# (com.healthcare.healthcare_auth.event.NotificationEvent) into the Kafka message headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Docker
spring.docker.compose.enabled=false

# Swagger related properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Password | Healthcare System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #243047;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .description {
            margin-bottom: 25px;
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .hint {
            margin-top: -10px;
            margin-bottom: 18px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Set Up Your Password</h1>

    <p class="description">
        Welcome to the Healthcare System.
        Create your password to activate your account and get started.
    </p>

    <form id="passwordSetupForm">

        <label for="password">New Password</label>
        <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="Enter your password"
        >

        <p class="hint">
            Use at least 8 characters, subject to your account's password policy.
        </p>

        <label for="confirmPassword">Confirm Password</label>

        <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="Re-enter your password"
        >

        <button type="submit" id="submitButton">
            Set Password
        </button>

        <div
                id="message"
                class="message"
                role="status"
                aria-live="polite">
        </div>

    </form>
</div>

<script>
    // Get the HTML elements.
    const form = document.getElementById("passwordSetupForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const messageElement = document.getElementById("message");

    // Extract the setup token from the URL.
    // Example: password-setup.html?token=abc123
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    // Display messages to the user.
    function showMessage(text, type) {
        messageElement.textContent = text;
        messageElement.className = "message " + type;
    }

    // Check whether the token exists.
    if (!token || !token.trim()) {
        showMessage(
            "The password setup link is missing its token. " +
            "Please use the link in your email.",
            "error"
        );
        submitButton.disabled = true;
    }

    // Handle form submission.
    form.addEventListener("submit", async function (event) {
        // Prevent the browser from reloading the page.
        event.preventDefault();
        // Read the entered passwords.
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        // Validate the token.
        if (!token || !token.trim()) {
            showMessage(
                "The password setup token is missing.",
                "error"
            );
            return;
        }

        // Check whether the passwords match.
        if (password !== confirmPassword) {
            showMessage(
                "The passwords do not match.",
                "error"
            );
            return;
        }

        // Disable the button while processing the request.
        submitButton.disabled = true;
        submitButton.textContent = "Setting Password...";

        try {
            // Send the request to your Spring Boot endpoint.
            const response = await fetch(
                "/api/v1/auth/password-setup",
                {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        token: token,
                        newPassword: password
                    })
                }
            );

            // Your backend returns 204 No Content on success.
            // Therefore, do not try to parse the response as JSON.
            if (!response.ok) {
                throw new Error(
                    "Unable to set your password. " +
                    "Your link may have expired or is invalid."
                );
            }

            // The request succeeded.
            showMessage(
                "Your password has been set successfully. " +
                "Your account is now activated.",
                "success"
            );

            // Clear the password fields.
            form.reset();

            // Remove the token from the visible URL.
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            // Keep the button disabled after success.
            submitButton.textContent = "Password Set";
        } catch (error) {
            // Display an error if the request fails.
            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

        } finally {
            // Re-enable the button only if the request failed.
            if (submitButton.textContent !== "Password Set") {
                submitButton.disabled = false;
                submitButton.textContent = "Set Password";
            }
        }

    });

</script>

</body>
</html>

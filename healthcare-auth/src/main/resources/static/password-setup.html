<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Password | Healthcare System</title>
    <style> * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #f3f6fb;
        font-family: Arial, sans-serif;
        color: #243047;
    }

    .container {
        width: 100%;
        max-width: 420px;
        padding: 35px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 26px;
    }

    .description {
        margin-bottom: 25px;
        color: #64748b;
        line-height: 1.6;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        border-radius: 6px;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
    }

    .success {
        display: block;
        background: #dcfce7;
        color: #166534;
    }

    .hint {
        margin-top: -10px;
        margin-bottom: 18px;
        font-size: 12px;
        color: #64748b;
    } </style>
</head>
<body>
<div class="container"><h1>Set Up Your Password</h1>
    <p class="description"> Welcome to the Healthcare System. Create your password to activate your account and get
        started. </p>
    <form id="passwordSetupForm"><label for="password">New Password</label> <input type="password" id="password"
                                                                                   name="password"
                                                                                   autocomplete="new-password" required
                                                                                   minlength="8"
                                                                                   placeholder="Enter your password">
        <p class="hint">Use at least 8 characters, subject to your account's password policy.</p> <label
                for="confirmPassword">Confirm Password</label> <input type="password" id="confirmPassword"
                                                                      name="confirmPassword" autocomplete="new-password"
                                                                      required minlength="8"
                                                                      placeholder="Re-enter your password">
        <button type="submit" id="submitButton">Set Password</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
</div>
<script> const form = document.getElementById("passwordSetupForm");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const submitButton = document.getElementById("submitButton");
const messageElement = document.getElementById("message"); // Read the setup token from the URL: // /password-setup.html?token=YOUR_SETUP_TOKEN const params = new URLSearchParams(window.location.search); const token = params.get("token"); function showMessage(text, type) { messageElement.textContent = text; messageElement.className = "message " + type; } if (!token) { showMessage( "The password setup link is missing its token. Please use the link in your email.", "error" ); submitButton.disabled = true; } form.addEventListener("submit", async function (event) { event.preventDefault(); const password = passwordInput.value; const confirmPassword = confirmPasswordInput.value; if (!token) { showMessage("The password setup token is missing.", "error"); return; } if (password !== confirmPassword) { showMessage("The passwords do not match.", "error"); return; } submitButton.disabled = true; submitButton.textContent = "Setting Password..."; try { const response = await fetch("/api/v1/auth/password-setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, newPassword: password }) }); const data = await response.json().catch(() => ({})); if (!response.ok) { throw new Error( data.message || "Unable to set your password. Your link may have expired." ); } showMessage( "Your password has been set successfully. Your account is now activated.", "success" ); form.reset(); } catch (error) { showMessage( error.message || "Something went wrong. Please try again.", "error" ); } finally { submitButton.disabled = false; submitButton.textContent = "Set Password"; } }); </script>
</body>
</html>

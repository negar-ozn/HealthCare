services:

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:latest
    container_name: healthcare-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ========================
  # HEALTHCARE
  #=========================
  postgres-core:
    image: postgres:17

    container_name: healthcare-postgreSQL
    restart: unless-stopped

    environment:
      POSTGRES_DB: healthcare-DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_core_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: healthcare-core-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_core_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # =======================
  # HEALTHCARE AUTH
  # =======================
  postgres-auth:
    image: postgres:17

    container_name: healthcare-auth-postgreSQL
    restart: unless-stopped

    environment:
      POSTGRES_DB: healthcare_auth_DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  # =======================
  # HEALTHCARE AUDIT
  # =======================
  postgres-audit:
    image: postgres:17

    container_name: healthcare-audit-postgreSQL
    restart: unless-stopped

    environment:
      POSTGRES_DB: healthcare-audit-DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  # ========================
  # HEALTHCARE NOTIFICATION
  # ========================
  postgres-notification:
    image: postgres:17

    container_name: healthcare-notification-postgreSQL
    environment:
      POSTGRES_DB: healthcare_notification_DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data


volumes:
  postgres_core_data:
  postgres_auth_data:
  postgres_notification_data:
  postgres_audit_data:
  redis_core_data:
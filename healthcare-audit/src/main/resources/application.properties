spring.application.name=healthcare-audit
server.port=8082

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5434/healthcare-audit-DB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Migration
spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Docker
spring.docker.compose.enabled=false

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics

# KAFKA Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=healthcare-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# It says: "When I receive JSON from Kafka, convert it to my healthcare-notification NotificationEvent."
#spring.kafka.consumer.properties.spring.json.value.default.type=com.healthcare.healthcare_audit.event.NotificationEvent
# It says: "This is a trusted class/package."
spring.kafka.consumer.properties.spring.json.trusted.packages=com.healthcare.healthcare_audit.event
